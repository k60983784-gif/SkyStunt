# Render Blueprint (free/paid web service). Deploy with "New > Blueprint" from the repository.
services:
  - type: web
    name: skystunt-io
    runtime: docker
    plan: starter            # free instances sleep when idle, which would drop live races
    healthCheckPath: /healthz
    envVars:
      - key: MAX_ROOMS
        value: "40"
      - key: MAX_CONNECTIONS
        value: "200"
      - key: SKYSTUNT_LOG
        value: "1"
